[package]
name = "deepeval-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The LLM evaluation framework for Rust — a port of deepeval."
readme = "../../README.md"
keywords = ["llm", "evaluation", "metrics", "testing", "ai"]
categories = ["development-tools::testing", "artificial-intelligence"]
autobins = false

[dependencies]
tokio.workspace = true
rig.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
minijinja.workspace = true
thiserror.workspace = true
regex.workspace = true
futures.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[features]
default = ["openai", "anthropic", "openai-compatible"]
openai = []
anthropic = []
openai-compatible = []
embeddings = []
cli = ["dep:clap", "dep:anyhow", "dep:serde_yaml"]

[dependencies.clap]
workspace = true
optional = true

[dependencies.anyhow]
version = "1"
optional = true

[dependencies.serde_yaml]
workspace = true
optional = true

[[bin]]
name = "deepeval"
path = "src/bin/deepeval.rs"
required-features = ["cli"]
